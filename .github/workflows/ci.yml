name: StockOracle Pro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Testing & Linting ─────────────────────────────────────────────
  backend-ci:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio flake8
          pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint with Flake8 (Syntax errors & undefined names)
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///backend/data/test_stockoracle.db
          DEBUG: "True"
        run: |
          pytest tests/ -v --disable-warnings

  # ── 2. Frontend Build Verification ──────────────────────────────────────────
  frontend-ci:
    name: Frontend Build & Bundle Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Production Frontend Bundle (Vite)
        run: npm run build

  # ── 3. Architecture & Code Invariants Verification ──────────────────────────
  invariants-check:
    name: Architecture Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Core Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy sqlalchemy
          pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Invariants Test Suite (AGENTS.md rules)
        run: |
          pytest tests/test_database_invariants.py tests/test_data_invariants.py -v
