version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install
    build:
      commands:
        # VITE_API_URL must be set in Amplify Console → App settings → Environment variables.
        # Do NOT hardcode it here — that prevents staging/production environment separation.
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
